; Copia este archivo a config.ini y rellena tus datos reales.
; config.ini NUNCA se sube a git (está en .gitignore) porque contiene credenciales.

[server]
; Protocolo que usa el servidor al que te conectas con WinSCP: sftp o ftp
protocol = sftp
host = tu.servidor.ejemplo.com
port = 22
username = tu_usuario
password = tu_contraseña

; Ruta remota donde el logger Campbell deja los archivos .dat
remote_path = /ruta/a/los/datos

; Nombres exactos de las tablas/archivos a sincronizar, separados por comas.
; Ejemplo: CR1000_Meteo.dat,CR1000_Rain.dat
; Si lo dejas vacío, se usa file_pattern como patrón glob para listar el directorio.
files =
file_pattern = *.dat

[wind_source]
; OPCIONAL: wind_speed/wind_dir no vienen del logger de meteo de arriba,
; sino de los ficheros full_output de EddyPro (equipo de flujo). Si tienes
; acceso local a esos ficheros (p. ej. en la misma máquina que el proyecto
; EddyCovariance), indica aquí sus rutas y ejecuta src/sync_wind.py aparte
; de sync_campbell.py. Si no aplica a tu estación, borra esta sección.
eddypro_dir = C:\ruta\a\rawdata\eddypro
ghg_dir = C:\ruta\a\rawdata

[dashboard]
; Título que aparece en la web
site_title = Estación Meteorológica
; Cuántos días de histórico se muestran en las gráficas
days_to_show = 7
; Cada cuántos segundos se auto-refresca la página en el navegador del usuario
refresh_seconds = 300
; Lista de variables a mostrar, separadas por comas (nombres tal como los
; guarda sync_campbell.py/sync_wind.py en meteo.db). Vacío = mostrar todas.
variables =
